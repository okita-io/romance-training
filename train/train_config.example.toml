# Template — legacy Mistral-Nemo example (paused at checkpoint-1750).
# Active Phase 4 training: train_config.gemma4_spark.toml on DGX Spark (spark-4f07).
# Do not use this file to train on the RTX 3090 — that host is inference-only.
#
# Run from Spark: ./run_phase4_docker.sh --config train_config.toml --resume
# Optional env overrides: TRAIN_CONFIG_PATH, ROMANCE_BASE_MODEL

# Mistral-Nemo 12B — historical 4-bit QLoRA recipe (24 GB-class); Spark is the training host now
[model]
base = "mistralai/Mistral-Nemo-Instruct-2407"
max_seq_length = 4096
load_in_4bit = true

[lora]
rank = 32
alpha = 32
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[training]
batch_size = 2
grad_accumulation_steps = 8
# effective batch = 16
max_steps = 3000
learning_rate = 2.0e-4
sft_max_seq_length = 2048
warmup_steps = 50
logging_steps = 25
save_steps = 500
eval_steps = 500
eval_batch_size = 1
# none | tensorboard | wandb | cli | tensorboard,cli
report_to = "cli"

[paths]
# Paths are relative to train/ (where train_qwen_unsloth.py lives).
data_dir = "style_training"
output_dir = "mistral_style_lora"

[export]
f16_dir = "mistral_style_f16"
q5_dir = "mistral_style_q5"
q4_dir = "mistral_style_q4"
